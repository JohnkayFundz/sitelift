name: SiteLift migration safety test

on:
  pull_request:
    paths:
      - "supabase/migrations/202610250001_sitelift_active_checkout_unique_index.sql"
      - ".github/workflows/sitelift-migration-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-checkout-index:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitelift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sitelift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sitelift_test
      MIGRATION: supabase/migrations/202610250001_sitelift_active_checkout_unique_index.sql
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply migration on an empty test table
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE public.audit_payments (id bigserial PRIMARY KEY, audit_id uuid NOT NULL, status text NOT NULL);"
          psql -v ON_ERROR_STOP=1 -f "$MIGRATION"

      - name: Verify index rejects a second active checkout
        run: |
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.audit_payments (audit_id, status) VALUES ('11111111-1111-4111-8111-111111111111', 'pending');"
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.audit_payments (audit_id, status) VALUES ('11111111-1111-4111-8111-111111111111', 'processing');" 2>index-error.txt; then
            echo "ERROR: duplicate active checkout unexpectedly succeeded."
            exit 1
          fi
          grep -q "audit_payments_one_active_checkout_per_audit_idx" index-error.txt
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.audit_payments (audit_id, status) VALUES ('11111111-1111-4111-8111-111111111111', 'paid'), ('11111111-1111-4111-8111-111111111111', 'paid');"
          echo "Unique index blocks duplicate active rows and permits multiple paid rows."

      - name: Verify migration refuses pre-existing duplicate active checkouts
        run: |
          psql -v ON_ERROR_STOP=1 -c "DROP TABLE public.audit_payments; CREATE TABLE public.audit_payments (id bigserial PRIMARY KEY, audit_id uuid NOT NULL, status text NOT NULL);"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.audit_payments (audit_id, status) VALUES ('22222222-2222-4222-8222-222222222222', 'pending'), ('22222222-2222-4222-8222-222222222222', 'processing');"
          if psql -v ON_ERROR_STOP=1 -f "$MIGRATION" 2>migration-error.txt; then
            echo "ERROR: migration unexpectedly accepted duplicate active checkouts."
            exit 1
          fi
          grep -q "duplicate active checkouts exist" migration-error.txt
          echo "Migration correctly stops when duplicate active rows already exist."
